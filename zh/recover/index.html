<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>找回许可证 · colooon</title>
  <link rel="stylesheet" href="/purchase/checkout.css">
  <script src="/language.js" defer></script>
  <script src="/purchase/recovery.js" defer></script>
<link rel="stylesheet" href="/assets/site-shell.css">
</head>
<body class="site-store">
  <!-- site-header -->
<header class="site-chrome site-chrome-header">
  <div class="site-chrome-inner">
    <a class="site-chrome-logo notranslate" translate="no" href="/zh/" aria-label="colooon · 首页"><span class="site-chrome-dots" aria-hidden="true"></span><img src="/colooon-wordmark.svg" alt="colooon" width="119"></a>
    <nav class="site-chrome-links" aria-label="主导航">
      <a href="/zh/">首页</a>
      <a href="/zh/journey/"><span class="notranslate" translate="no">Journey</span></a>
      <a href="/zh/purchase/">试用与购买</a>
      <a href="/recover/" data-language-choice="en" lang="en">EN</a>
      <a class="site-chrome-install" href="https://chromewebstore.google.com/detail/khenfhbjoefjfkhpjefmnjlkdonehfok">添加到 Chrome</a>
    </nav>
  </div>
</header>
<!-- /site-header -->

  <main class="content">
    <section class="workspace" aria-labelledby="recovery-title">
      <div class="intro">
        <h1 id="recovery-title">找回许可证</h1>
        <p id="recovery-unavailable">许可证找回将在购买开放后提供。</p>
        <p id="recovery-instructions" hidden>使用下单时填写的邮箱获取找回链接。</p>
      </div>
      <div class="card">
        <div id="recovery-actions" hidden>
          <form id="recovery-form" method="post">
            <label for="order-email">订单邮箱</label>
            <input id="order-email" name="email" type="email" autocomplete="email" maxlength="254" required>
            <button class="button primary" type="submit" disabled>发送找回链接</button>
          </form>
          <button id="redeem-recovery" class="button primary" type="button" hidden>领取许可证</button>
          <div id="recovered-license" class="license-control" hidden>
            <input id="license-code" class="license-field" type="text" aria-label="许可证代码" readonly>
            <button id="copy-license" class="button" type="button">复制许可证</button>
          </div>
          <p id="recovery-feedback" class="feedback" role="status"></p>
        </div>
        <p><a class="text-link" href="/zh/support/">联系支持</a></p>
        <a class="text-link" href="/zh/purchase/">返回试用与购买</a>
      </div>
    </section>

  </main>

<!-- site-footer -->
<footer class="site-chrome site-chrome-footer">
  <div class="site-chrome-inner">
    <div class="site-chrome-brand">
      <a class="site-chrome-logo notranslate" translate="no" href="/zh/" aria-label="colooon · 首页"><span class="site-chrome-dots" aria-hidden="true"></span><img src="/colooon-wordmark.svg" alt="colooon" width="119"></a>
      <p>你的 AI 对话随行笔记本</p>
    </div>
    <nav class="site-chrome-links" aria-label="网站服务">
      <a href="/zh/terms/">服务条款</a>
      <a href="/zh/refunds/">退款政策</a>
      <a href="/zh/privacy/">隐私政策</a>
      <a href="/zh/recover/" aria-current="page">找回许可证</a>
      <a href="/zh/support/">支持</a>
      <a href="mailto:support@colooon.com">support@colooon.com</a>
      <a href="https://chromewebstore.google.com/detail/khenfhbjoefjfkhpjefmnjlkdonehfok">Chrome 网上应用店<span aria-hidden="true" class="site-external-arrow">↗</span></a>
    </nav>
  </div>
</footer>
<!-- /site-footer -->
</body>
</html>
