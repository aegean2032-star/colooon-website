<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>找回许可证 · colooon</title>
  <link rel="stylesheet" href="/purchase/checkout.css">
  <script src="/language.js" defer></script>
  <script src="/purchase/recovery.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="content header-inner">
      <a class="wordmark" href="/zh/" aria-label="colooon">
        <span class="brand-dots" aria-hidden="true"></span><img src="/colooon-wordmark.svg" alt="colooon">
      </a>
      <nav class="header-controls" aria-label="主导航">
        <a class="site-section-link" href="/zh/">产品</a>
        <a class="site-section-link" href="/zh/journal/">开发日记</a>
        <a class="site-section-link" href="/zh/purchase/">试用与购买</a>
        <span class="language-switch" role="group" aria-label="语言">
          <a href="/zh/recover/" lang="zh-CN" hreflang="zh-CN" data-language-choice="zh" aria-current="true">中文</a>
          <a href="/recover/" lang="en" hreflang="en" data-language-choice="en">EN</a>
        </span>
      </nav>
    </div>
  </header>

  <main class="content">
    <section class="workspace" aria-labelledby="recovery-title">
      <div class="intro">
        <h1 id="recovery-title">找回许可证</h1>
        <p id="recovery-unavailable">许可证找回将在购买开放后提供。</p>
        <p id="recovery-instructions" hidden>使用下单时填写的邮箱获取找回链接。</p>
      </div>
      <div class="card">
        <div id="recovery-actions" hidden>
          <form id="recovery-form" method="post">
            <label for="order-email">订单邮箱</label>
            <input id="order-email" name="email" type="email" autocomplete="email" maxlength="254" required>
            <button class="button primary" type="submit" disabled>发送找回链接</button>
          </form>
          <button id="redeem-recovery" class="button primary" type="button" hidden>领取许可证</button>
          <div id="recovered-license" class="license-control" hidden>
            <input id="license-code" class="license-field" type="text" aria-label="许可证代码" readonly>
            <button id="copy-license" class="button" type="button">复制许可证</button>
          </div>
          <p id="recovery-feedback" class="feedback" role="status"></p>
        </div>
        <p><a class="text-link" href="/zh/support/">联系支持</a></p>
        <a class="text-link" href="/zh/purchase/">返回试用与购买</a>
      </div>
    </section>

  </main>
  <footer class="store-footer">
    <nav class="content store-footer-links" aria-label="帮助">
      <a href="/zh/terms/">服务条款</a>
      <a href="/zh/refunds/">退款政策</a>
      <a href="/zh/privacy/">隐私政策</a>
      <a href="/zh/support/">支持</a>
    </nav>
  </footer>
</body>
</html>
