<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>Recover your license · colooon</title>
  <link rel="stylesheet" href="/purchase/checkout.css">
  <script src="/language.js" defer></script>
  <script src="/purchase/recovery.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="content header-inner">
      <a class="wordmark" href="/" aria-label="colooon">
        <span class="brand-dots" aria-hidden="true"></span><img src="/colooon-wordmark.svg" alt="colooon">
      </a>
      <nav class="header-controls" aria-label="Primary">
        <a class="site-section-link" href="/">Product</a>
        <a class="site-section-link" href="/zh/journey/">Journey</a>
        <a class="site-section-link" href="/purchase/">Trial &amp; Purchase</a>
        <span class="language-switch" role="group" aria-label="Language">
          <a href="/zh/recover/" lang="zh-CN" hreflang="zh-CN" data-language-choice="zh">中文</a>
          <a href="/recover/" lang="en" hreflang="en" data-language-choice="en" aria-current="true">EN</a>
        </span>
      </nav>
    </div>
  </header>

  <main class="content">
    <section class="workspace" aria-labelledby="recovery-title">
      <div class="intro">
        <h1 id="recovery-title">Recover your license</h1>
        <p id="recovery-unavailable">License recovery will be available when purchases open.</p>
        <p id="recovery-instructions" hidden>Use the email address from your order to get a recovery link.</p>
      </div>
      <div class="card">
        <div id="recovery-actions" hidden>
          <form id="recovery-form" method="post">
            <label for="order-email">Order email</label>
            <input id="order-email" name="email" type="email" autocomplete="email" maxlength="254" required>
            <button class="button primary" type="submit" disabled>Email me a recovery link</button>
          </form>
          <button id="redeem-recovery" class="button primary" type="button" hidden>Get my license</button>
          <div id="recovered-license" class="license-control" hidden>
            <input id="license-code" class="license-field" type="text" aria-label="License code" readonly>
            <button id="copy-license" class="button" type="button">Copy license</button>
          </div>
          <p id="recovery-feedback" class="feedback" role="status"></p>
        </div>
        <p><a class="text-link" href="/support/">Contact support</a></p>
        <a class="text-link" href="/purchase/">Back to trial and purchase</a>
      </div>
    </section>

  </main>
  <footer class="store-footer">
    <nav class="content store-footer-links" aria-label="Help">
      <a href="/terms/">Terms of Service</a>
      <a href="/refunds/">Refund Policy</a>
      <a href="/privacy/">Privacy</a>
      <a href="/support/">Support</a>
    </nav>
  </footer>
</body>
</html>
